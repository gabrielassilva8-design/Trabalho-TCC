<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Camax - Acesso Rápido</title>
    <link rel="stylesheet" href="rápido.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="logo.webp" alt="Logo Centro Camax" width="48" height="48" class="logo-img">
                <span class="logo-text">CENTRO CAMAX</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <button class="back-button" id="backButton">
            <span class="back-arrow">&#10094;</span>
            <span class="back-text">Voltar</span>
        </button>

        <section class="title-section">
            <h1 class="page-title">Acesso Rápido</h1>
            <p class="page-subtitle">O que você deseja fazer hoje?</p>
        </section>

        <div class="cards-container">
            <div class="card">
                <div class="card-icon">
                    <svg class="store-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 24C8 24 12 16 16 16H48C52 16 56 24 56 24" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
                        <path d="M12 24V48H52V24" stroke="#1a1a1a" stroke-width="4"/>
                        <path d="M8 24H56" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
                        <rect x="16" y="16" width="8" height="8" fill="#1a1a1a"/>
                        <rect x="28" y="16" width="8" height="8" fill="#1a1a1a"/>
                        <rect x="40" y="16" width="8" height="8" fill="#1a1a1a"/>
                    </svg>
                </div>
                <h2 class="card-title">Sou feirante</h2>
                <button class="card-button" id="cadastrarBtn">Quero me cadastrar</button>
            </div>

            <div class="card">
                <div class="card-icon">
                    <svg class="bookmark-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 12H48V52L32 40L16 52V12Z" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="card-title">Boxes salvos</h2>
                <button class="card-button" id="acessarBtn">Acessar</button>
            </div>
        </div>
    </main>

    <script src="acesso.js"></script>
</body>
</html>
