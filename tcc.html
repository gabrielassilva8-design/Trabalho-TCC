<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Camax - Acesso Rápido</title>
    <link rel="stylesheet" href="/src/css/rápido.css">
</head>
<body>
    <header class="header">
        <div class="logo"><img src="/src/images/Logo centroCamax.svg" alt="Logo Centro Camax" class="logo-img"></div>
        <div class="container-do-título-da-logo"><h1 class="logo-text">CENTRO CAMAX</h1></div>
    </header>

    <main class="main-content">
        <button class="back-button" id="backButton">
            <span class="back-arrow"><img src="/src/images/Chevron right.svg" id="seta-voltar" alt="Seta para voltar"></span>
            <div class="back-text"><h3 id="voltar">Voltar</h3></div>
        </button>

        <section class="title-section">
            <div class="container-de-título-acesso-rápido"><h1 class="page-title">Acesso Rápido</h1></div>
            <p class="page-subtitle">O que você deseja fazer hoje?</p>
        </section>

        <section class="container-sou-feirante">
            <div class="card-feirante"><div class="icone-loja"><img src="/src/images/store-icon.svg" id="store-icon"></div></div>
            <div class="container-de-título-sou-feirante"><p id="título-sou-feirante">Sou feirante</p></div>
            <div class="container-de-botão-um"><button id="btn-um">Quero me cadastrar</button></div>
        </section>
        
        <section class="container-boxes-salvos">
            <div class="card-boxes-salvos"><div class="icone-salvo"><img src="/src/images/Group.svg" id="salvo-icon"></div></div>
              <div class="container-de-título-boxes-salvos"><p id="título-boxes-salvos">Boxes salvos</p></div>
               <div class="container-de-botão-dois"><button id="btn-dois">Acessar</button></div>
        </section>
    </main>
</body>
</html>
