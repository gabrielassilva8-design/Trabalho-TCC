<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Camax - Início</title>
    <link rel="stylesheet" href="/src/css/page_inicial.css">
</head>
<body>
    <!--Parte de Gabriela-->
    <header class="container-menu-de-navegação-um">
        <nav class="menu-de-navegação">
        <div class="container-da-logo"><img id="logo-centro-camax-um" src="/src/images/Logo centroCamax.svg" alt="Logo Centro Camax"></div>
        <div class="container-do-título-da-logo"><h1 id="título-centro-camax-um">CENTRO CAMAX</h1></div>
        <div class="container-do-botão-entrar"><button id="btn-entrar" href="/">Entrar</button></div>
        </nav>
    </header>
    <section class="seção-de-busca">
        <div class="container-do-título-de-busca"><p id="título-de-busca">Encontre feirantes, categoria e informação</p></div>
        <div class="container-da-barra-de-busca"><input id="barra-de-busca" type=" search"></div>
        <div class="container-do-ícone-da-lupa"><img id="ícone-da-lupa" src="/src/images/Search.svg"></div>
    </section>
    <section class="seção-de-categorias">
        <div class="container-título-de-categorias"><h3 id="título-de-categorias">Categorias</h3></div>
        <div class="card-alimentação"><button id="btn-alimentação"></button></div>
    </section>
    <section class="seção-de-carousel"></section>
    <section class="seção-de-feirantes-destaque"></section>
</body>
</html>
