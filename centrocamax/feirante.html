<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feirante</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header class="topo">
    <img src="logo.png" alt="Centro Camax">
</header>

<div class="container">

    <a href="acesso.html" class="voltar">
        <i class="fa-solid fa-chevron-left"></i>
        Voltar
    </a>

    <h1>Feirante</h1>

    <div class="grid-feirante">

        <!-- CARD ESQUERDO -->
        <div class="card">

            <label>Digite o nome do seu estabelecimento:</label>
            <input type="text">

            <label>Digite o número do seu box:</label>
            <input class="input-pequeno" type="text">

            <label>Selecione a categoria do seu estabelecimento:</label>

            <select>
                <option>Selecione</option>
                <option>Carnes</option>
                <option>Frutas</option>
                <option>Verduras</option>
                <option>Temperos</option>
            </select>

            <button class="btn-verde">
                Entrar
            </button>

        </div>

        <!-- CARD DIREITO -->
        <div class="card">

            <div class="upload">

                <i class="fa-regular fa-image"></i>

                <p>Adicione uma imagem do local</p>

            </div>

            <span class="obrigatorio">
                *Obrigatório
            </span>

            <label>Nome do espaço:</label>
            <input type="text">

            <label>Número do box:</label>
            <input class="input-pequeno" type="text">

            <label>Categoria:</label>
            <input type="text">

            <button class="btn-verde">
                Concluir
            </button>

        </div>

    </div>

</div>

</body>
</html>
